<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rug or Not?</title>
    <style>
      @font-face {
        font-family: 'Pixelify Sans';
        src: url('./fonts/PixelifySans.ttf') format('truetype');
        font-weight: 400 700;
        font-display: block;
      }
      @font-face {
        font-family: 'VT323';
        src: url('./fonts/VT323-Regular.ttf') format('truetype');
        font-weight: 400;
        font-display: block;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #1b1a1f;
        overflow: hidden;
      }
      #game {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      /* Preload the fonts so the first Text object renders crisply. */
      .font-preload {
        position: absolute;
        left: -9999px;
        top: -9999px;
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div class="font-preload" aria-hidden="true">
      <span style="font-family: 'Pixelify Sans'">.</span>
      <span style="font-family: 'VT323'">.</span>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

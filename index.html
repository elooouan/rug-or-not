<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rug or Not?</title>
    <meta
      name="description"
      content="A pixel-noir detective game about spotting crypto rug pulls. All cases are fictional."
    />
    <meta name="theme-color" content="#1b1a1f" />
    <!-- Social preview. Crawlers need absolute URLs: point these at wherever the game is hosted. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Rug or Not?" />
    <meta
      property="og:description"
      content="A pixel-noir crypto detective game. Read the evidence, pin what smells, stamp the verdict."
    />
    <meta property="og:image" content="https://elooouan.github.io/rug-or-not/img/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rug or Not?" />
    <meta
      name="twitter:description"
      content="A pixel-noir crypto detective game. Read the evidence, pin what smells, stamp the verdict."
    />
    <meta name="twitter:image" content="https://elooouan.github.io/rug-or-not/img/og.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <style>
      @font-face {
        font-family: 'Pixelify Sans';
        src: url('./fonts/PixelifySans.ttf') format('truetype');
        font-weight: 400 700;
        font-display: block;
      }
      @font-face {
        font-family: 'VT323';
        src: url('./fonts/VT323-Regular.ttf') format('truetype');
        font-weight: 400;
        font-display: block;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #1b1a1f;
        overflow: hidden;
      }
      #game {
        width: 100%;
        height: 100%;
      }
      /* Phones in portrait can't fit the desk; ask for landscape. */
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        background: #1b1a1f;
        color: #d8c9a8;
        font-family: 'Pixelify Sans', monospace;
        text-align: center;
        padding: 40vh 24px 0;
        font-size: 18px;
      }
      /* Touch devices only: a narrow desktop window should still just play. */
      @media (orientation: portrait) and (pointer: coarse) and (max-width: 900px) {
        #rotate {
          display: block;
        }
      }
      /* Preload the fonts so the first Text object renders crisply. */
      .font-preload {
        position: absolute;
        left: -9999px;
        top: -9999px;
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate">
      Rotate your phone.<br /><small>The detective's desk needs the width.</small>
    </div>
    <div class="font-preload" aria-hidden="true">
      <span style="font-family: 'Pixelify Sans'">.</span>
      <span style="font-family: 'VT323'">.</span>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
